aid: captureproof
name: CaptureProof
description: 'CaptureProof is a HIPAA-compliant visual health record and telemedicine
  platform for secure photo and video communication between patients and clinicians.
  Its "Smart Medical Camera" iOS and Android apps let providers and patients capture
  consistent, medical-quality images and video, automatically organize and compare
  them chronologically, and layer AI-driven visual biometrics and clinical insight
  on top for remote patient monitoring, asynchronous ("visual voicemail") care, and
  post-op and chronic-condition follow-up. CaptureProof supports EHR/EMR integration
  and SSO handled by its technical team, and bills through remote-monitoring CPT codes.
  It is HIPAA, GDPR, and Swiss FADP aligned with AES-256 encryption. Backed by Techstars.'
